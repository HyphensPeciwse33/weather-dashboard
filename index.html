<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p>Real-time weather updates for your location</p>
        </header>

        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Enter city name..." 
                class="search-box"
            >
            <button id="searchBtn" class="search-btn">Search</button>
        </div>

        <div class="current-weather">
            <div class="weather-card">
                <h2 id="cityName">Loading...</h2>
                <div class="temperature">
                    <span id="temp">--</span>°C
                </div>
                <p id="description">--</p>
                <div class="weather-details">
                    <div class="detail">
                        <span class="label">Humidity</span>
                        <span id="humidity">--</span>%
                    </div>
                    <div class="detail">
                        <span class="label">Wind Speed</span>
                        <span id="windSpeed">--</span> m/s
                    </div>
                    <div class="detail">
                        <span class="label">Feels Like</span>
                        <span id="feelsLike">--</span>°C
                    </div>
                </div>
            </div>
        </div>

        <div class="forecast-section">
            <h3>5-Day Forecast</h3>
            <div id="forecastContainer" class="forecast-container">
                <p>Loading forecast...</p>
            </div>
        </div>

        <footer>
            <p>Data provided by OpenWeatherMap API</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
